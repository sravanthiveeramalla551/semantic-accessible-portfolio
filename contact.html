<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sravanthi Portfolio</title>
    <meta name="description" content="Contact Sravanthi through the accessible portfolio contact form.">
    <meta name="author" content="Sravanthi">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav aria-label="Main navigation">
        <a href="index.html" aria-label="Go to Home page">Portfolio</a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
    </nav>
</header>
<main>
    <section aria-labelledby="contact-heading">
        <h1 id="contact-heading">Contact Me</h1>
        <p>Fill out the form below to get in touch with me.</p>
        <form action="#" method="post" aria-label="Contact form">
            <div>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required aria-required="true">
            </div>
            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email" required aria-required="true">
            </div>
            <div>
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required aria-required="true">
            </div>
            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </section>
</main>
<footer><p>&copy; 2026 Sravanthi. All rights reserved.</p></footer>
</body>
</html>
